name: Publish portfolio websites
on:
  push:
    branches: [main]
    paths:
      - index.html
      - "*.zip"
      - .github/workflows/static.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble static websites
        run: |
          mkdir _site
          cp index.html _site/
          for site in holodok alterego-partners urbech candles modular work-cases; do
            unzip -q "$site.zip" -d _site
          done
          for site in holodok alterego-partners urbech candles modular; do
            test -s "_site/$site/index.html"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
